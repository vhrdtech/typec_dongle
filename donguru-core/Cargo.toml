[package]
name = "donguru-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Library for interacting with Donguru dongles"

[dependencies]
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
# layered config files (CLI-9)
toml = "0.9"
donguru_api.workspace = true
# the firmware's own debug rules (refused pins, claim table, UCPD roles), modelled by the mock
donguru_board = { path = "../donguru_board" }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
# local checkout next to this repo (~/git/wire_weaver), like donguru_api
wire_weaver = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"] }
wire_weaver_client = { git = "https://github.com/vhrdtech/wire_weaver", features = ["stm32_dfu"] }
ww_device = { git = "https://github.com/vhrdtech/wire_weaver", optional = true }
# the generated client names its observe types (BatchedOwned of `+batched` properties)
ww_client_server = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"] }
ww_si = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std", "time", "electrical", "mechanical", "thermal"] }
ww_stream = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"], optional = true }
# stdlib traits of the API tree: the generated client names their types
ww_adc = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"] }
ww_board_info = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"] }
ww_counters = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std", "host"] }
ww_dfu = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"] }
ww_date_time = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"] }
ww_firmware_info = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"] }
ww_gpio = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"] }
ww_i2c = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"] }
ww_indication = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"] }
ww_log = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"] }
ww_timebase = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"] }
ww_uart = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"] }
ww_uid = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"] }
ww_user_info = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"] }
# CMSIS-DAP v2 only: the default cmsisdap_v1 pulls in hidapi (C)
probe-rs = { version = "0.32", optional = true, default-features = false, features = ["builtin-targets"] }
# PD message record, decode and JSON lines, shared with rePort's sink log (pd_bench LOG-1); local checkout next to
# this repo (~/git/pd_bench), like wire_weaver
pd_log = { git = "https://github.com/romixlab/pd_bench", features = ["std"] }
# `device.counters` and `device.log` decoded with the firmware's ELF, found by its build id (CLI-19)
cnt_core = "0.5.1"
# a crash record's call chain as file:line frames (CLT-59), src/crash.rs
ww_report = { git = "https://github.com/vhrdtech/wire_weaver" }
defmt-decoder = "1.1"

[features]
# Run the SWD memtest (CORE-5) through a debug probe
probe-rs = ["dep:probe-rs"]
# A DonguruApi server in the same process (`mock`): the test double for the CLI, GUI and Python (CORE-3)
mock = ["wire_weaver_client/in_process", "dep:ww_device", "dep:ww_stream"]

[dev-dependencies]
tempfile = "3"
semver = "1"
ww_stm32_dfu = { package = "stm32_dfu_host", git = "https://github.com/vhrdtech/wire_weaver", features = ["sim"] }
donguru-core = { path = ".", features = ["mock"] }
tokio = { version = "1", features = ["rt-multi-thread", "process"] }
# examples/uart_resume.rs: the state its two processes hand over
serde_json.workspace = true
# examples/device_log.rs: defmt frames decoded with the firmware's ELF, found by its build id
clap.workspace = true
defmt-decoder = "1.1"
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "std"] }
