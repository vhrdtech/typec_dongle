[package]
name = "donguru_api"
version = "0.7.0" # identifies the API on the wire, bump with every change
edition.workspace = true
license.workspace = true
description = "WireWeaver API of the donguru firmware"

[package.metadata.wire_weaver]
# the API's wire version (WireWeaver EVO-31): what devices and hosts decide on at link setup, docs/evolution/rules.md
wire = "w1.0"

[features]
# owned (alloc) variants of the API types, for host-side users
std = [
    "wire_weaver/std",
    "ww_si/std",
    "ww_adc/std",
    "ww_board_info/std",
    "ww_counters/std",
    "ww_dfu/std",
    "ww_firmware_info/std",
    "ww_gpio/std",
    "ww_i2c/std",
    "ww_indication/std",
    "ww_log/std",
    "ww_timebase/std",
    "ww_uart/std",
    "ww_uid/std",
    "ww_user_info/std",
]
defmt = ["wire_weaver/defmt", "dep:defmt"]

[dependencies]
defmt = { version = "1.1", optional = true }
# local checkout next to this repo (~/git/wire_weaver)
wire_weaver = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_si = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false, features = ["time", "electrical", "mechanical", "thermal", "dimensionless", "information"] }
# stdlib traits implemented by the API (device contract, indication, IO family)
ww_adc = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_board_info = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_counters = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_dfu = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_firmware_info = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_gpio = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_i2c = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_indication = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_log = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_timebase = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_uart = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_uid = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_user_info = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }

[dev-dependencies]
# the evolution check (tests/evolution.rs): this crate compared with its snapshots in api_snapshots/
wire_weaver_evolution = { git = "https://github.com/vhrdtech/wire_weaver" }
