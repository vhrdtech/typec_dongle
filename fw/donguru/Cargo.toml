[package]
name = "donguru"
version = "0.1.1"
edition = "2024"

# standalone crate: keeps an enclosing Cargo workspace from claiming it
[workspace]

[dependencies]
defmt = "1.1"
# defmt's global logger (API-10): every frame into device.log over WireWeaver, teed to the RTT channel "defmt" that
# probe-rs / cnt run show as before (src/log.rs)
ww_defmt_logger = { path = "../../../wire_weaver/ww_defmt_logger", features = ["rtt"] }
rtt-target = "0.6"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
portable-atomic = { version = "1.11", features = ["critical-section"] } # atomics for Cortex-M0(+)
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32g0b1ce", "unstable-pac", "exti", "time", "time-driver-tim4"] } # not "any": it would pick TIM15, which drives the PF1 LED
embassy-usb = { version = "0.6.0", default-features = false, features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2" }
static_cell = "2.1"
assign-resources = "0.5.0"
cnt = "0.5" # 0.5: used words and format version, served as device.counters (ww_counters)
# crash capture: HardFault / panic record kept across reset, reset cause (src/last_reset.rs); the panic handler
bedrock_crash = { path = "../../../embedded_bedrock/bedrock_crash", features = ["cortex-m", "defmt"] }
# the LED animation and driver (src/led.rs) and the `leds` indication bookkeeping (src/ww/leds.rs), DEV-12; from the
# embedded_bedrock checkout next to this repo, as its ww-indication feature takes WireWeaver from the checkout next to it
bedrock_led = { path = "../../../embedded_bedrock/bedrock_led", features = ["embassy", "ww-indication", "defmt"] }
# the shared clock (DEV-13, FW-44): host steer points onto UTC, LEDs run on it (bedrock_led's `align`). No oscillator
# backend here (HSI trim too coarse for Donguru, decided 21 Oct 2026) and no sync line, so `ww-timebase` is the only
# feature besides `embassy`.
bedrock_sync = { path = "../../../embedded_bedrock/bedrock_sync", features = ["embassy", "ww-timebase", "defmt"] }
# CMSIS-DAP command processing (SWD/JTAG state machine), transport written ourselves against embassy-usb: its own
# `usb` module targets the separate `usb-device` crate, incompatible with the embassy-usb stack used here.
# Its own "defmt" feature pulls defmt 0.3, a different major version than ours (1.1): left off, nothing here needs
# to Format-print its types directly.
# "usb-hs": DAP_Info reports a 512-byte DAP packet. Nothing else: the feature only switches `DAP2_PACKET_SIZE`,
# and besides DAP_Info that constant sizes buffers in the `usb` module not used here. The packets are still
# 64 bytes on the bus, src/cmsis_dap.rs splits and joins (FW-19).
dap-rs = { version = "0.2", default-features = false, features = ["usb-hs"] }
# where a CMSIS-DAP request ends when it spans several USB packets: no_std, unit-tested on the host
donguru_dap = { path = "../../donguru_dap" }
# board logic, no_std, unit-tested on the host: hub (U301) variant detection and per-variant config, VBUS modes and
# the guard
donguru_board = { path = "../../donguru_board", features = ["defmt"] }
# WireWeaver: API crate in the repo root, served by src/ww.rs. wire_weaver from the local checkout next to this repo
donguru_api = { path = "../../donguru_api", features = ["defmt"] }
wire_weaver = { path = "../../../wire_weaver/wire_weaver", default-features = false, features = ["defmt"] }
ww_client_server = { path = "../../../wire_weaver/ww_stdlib/ww_client_server", default-features = false }
# observe tables and stream states of the generated server (SRV-18, counted and reliable streams)
# persistent-ram: device.log's store in .uninit RAM, kept across a crash and reset (API-10)
# lz4: `uart[1].rx` compressed for hosts that decode it (WireWeaver API-55, FW-42)
ww_stream = { path = "../../../wire_weaver/ww_stream", default-features = false, features = ["persistent-ram", "lz4"] }
# the encoder of `uart[1].rx`; ram: its hot functions run from SRAM, ~30 % fewer cycles than from flash (FW-42)
ww_lz4 = { path = "../../../wire_weaver/ww_lz4", features = ["ram"] }
# stdlib traits the API implements (`donguru_api` depends on them too): types in the handler signatures
ww_si = { path = "../../../wire_weaver/ww_stdlib/ww_si", default-features = false, features = ["time", "electrical", "mechanical", "thermal", "i32", "u32"] }
ww_adc = { path = "../../../wire_weaver/ww_stdlib/ww_adc", default-features = false }
ww_board_info = { path = "../../../wire_weaver/ww_stdlib/ww_board_info", default-features = false }
ww_counters = { path = "../../../wire_weaver/ww_stdlib/ww_counters", default-features = false }
ww_dfu = { path = "../../../wire_weaver/ww_stdlib/ww_dfu", default-features = false, features = ["defmt"] }
ww_firmware_info = { path = "../../../wire_weaver/ww_stdlib/ww_firmware_info", default-features = false, features = ["build-id", "cortex-m", "defmt"] }
ww_gpio = { path = "../../../wire_weaver/ww_stdlib/ww_gpio", default-features = false }
ww_i2c = { path = "../../../wire_weaver/ww_stdlib/ww_i2c", default-features = false }
ww_indication = { path = "../../../wire_weaver/ww_stdlib/ww_indication", default-features = false }
ww_log = { path = "../../../wire_weaver/ww_stdlib/ww_log", default-features = false }
ww_timebase = { path = "../../../wire_weaver/ww_stdlib/ww_timebase", default-features = false }
ww_date_time = { path = "../../../wire_weaver/ww_stdlib/ww_date_time", default-features = false }
ww_uart = { path = "../../../wire_weaver/ww_stdlib/ww_uart", default-features = false }
ww_uid = { path = "../../../wire_weaver/ww_stdlib/ww_uid", default-features = false }
ww_user_info = { path = "../../../wire_weaver/ww_stdlib/ww_user_info", default-features = false }
wire_weaver_usb_embassy = { path = "../../../wire_weaver/mcu/wire_weaver_usb_embassy" }
# device.settings and device.label kept in flash (API-19, src/settings.rs): the settings store, reading the flash
# through the ECC-safe wrapper so a word cut by a power loss reads as zeros instead of an NMI on every boot
# (nmi-handler: its NMI handler, panicking on any other NMI, so the crash record catches it)
ww_settings = { path = "../../../wire_weaver/ww_settings/ww_settings", features = ["defmt"] }
ww_ecc_flash = { path = "../../../wire_weaver/mcu/ww_ecc_flash", features = ["nmi-handler", "defmt"] }
usb251xb = { version = "0.1.0", default-features = false, features = ["async", "defmt"] }

[features]
default = ["rev_a", "debug-button", "debug-api"]
# B153A, the boards built so far: the workarounds for its known bugs (hw/b153_typec_serial/doc/hw_b153a.md §0,
# change/change_b153b.md), FW-47. A release firmware for rev B is built without it; the first boards keep it for
# testing and jigs. Without it the firmware follows rev B's schematic where it is known, `TODO(ID)` where not.
rev_a = []
# the `debug` level of the API (bring-up and production test, API-18); without it the level answers Unimplemented,
# the API stays the same (decision D2). Can be cut if flash gets scarce.
debug-api = []
# periodic ADC readings in the debug log
debug-adc = []
# switch / button state changes in the debug log
debug-button = []
# `debug.uart_replay`: text captures in flash (`replay/`, 96 KiB) sent out of the header UART in a loop, a full-rate
# source for `uart[1].rx` (FW-42); without it the method answers Unsupported
uart-replay = []
# SWD-host starts in SPI mode (FW-21, SPI2 through the SBU level shifter) instead of bit-bang; the mode can still be
# changed at run time with `DonguruApi::swd_mode`
swd-spi = []
# a test image that panics at every start before USB is up, to check the boot-loop fallback into the ROM bootloader
# (FW-45); never for a release
crash-loop-test = []

[build-dependencies]
ww_firmware_info = { path = "../../../wire_weaver/ww_stdlib/ww_firmware_info", features = ["build"] } # FirmwareInfo facts (build.rs)

[dev-dependencies]
# the examples' logger; the firmware has its own (src/log.rs)
defmt-rtt = { version = "1.3", features = ["disable-blocking-mode"] }
# the examples' panic handler; the firmware has its own (src/last_reset.rs, crash capture)
panic-probe = { version = "1.0", features = ["print-defmt"] }

# to solve "can't find crate for test
[[bin]]
name = "donguru"
path = "src/main.rs"
test = false
doctest = false
bench = false

# See https://docs.rust-embedded.org/book/unsorted/speed-vs-size.html
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3           # embedded dev builds are usually unusable at opt-level 0
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2               # debug info does not end up in flash
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3           # speed: USB throughput depends on it (FW-24), 113 KB vs 87 KB for "z"
overflow-checks = false

# Do not optimize build scripts / proc-macros: faster clean builds
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

# embassy from upstream main at a pinned rev: double-buffered USB bulk endpoints on the G0 (embassy-rs/embassy#7275,
# FW-24) are merged but not released (crates.io embassy-stm32 is 0.6.0). main still has the versions asked for above
# (0.6.0 / 0.10.0 / 0.5.1 / 0.8.0), so the dependency lines stay the crates.io ones and this block swaps the source;
# every embassy crate comes from the same tree, as embassy-stm32's path dependencies would otherwise clash with the
# crates.io ones. The code uses main's API (CamelCase PAC enums, unified ADC driver, `usb::Driver::new` interrupt
# last). Back to crates.io: drop this block once the next embassy-stm32 release ships (bump the versions above).
# For now the tree is romixlab/embassy `donguru-ring-copy`: upstream 262fdba plus one commit, the DMA ring buffer copying
# out in up to two runs instead of a software division per byte (on the M0+ the header UART got 16 kB/s at 5.8 Mbaud
# without it, FW-42). Back to embassy-rs once that fix is merged upstream.
# bedrock_led and bedrock_sync take WireWeaver from its git (embedded_bedrock's workspace dependencies); this points that
# source at the checkout next to this repo, so they and the firmware share one wire_weaver, ww_indication, ww_timebase
# (two copies of a crate are two types: E0308 in ww/leds.rs and ww/clock.rs otherwise)
[patch."https://github.com/vhrdtech/wire_weaver"]
wire_weaver = { path = "../../../wire_weaver/wire_weaver" }
ww_date_time = { path = "../../../wire_weaver/ww_stdlib/ww_date_time" }
ww_dfu = { path = "../../../wire_weaver/ww_stdlib/ww_dfu" }
ww_indication = { path = "../../../wire_weaver/ww_stdlib/ww_indication" }
ww_si = { path = "../../../wire_weaver/ww_stdlib/ww_si" }
ww_timebase = { path = "../../../wire_weaver/ww_stdlib/ww_timebase" }
ww_version = { path = "../../../wire_weaver/ww_stdlib/ww_version" }

[patch.crates-io]
embassy-stm32 = { git = "https://github.com/romixlab/embassy", rev = "84ae135f91069d49c8dcb823a677e9f4b4a1e534" }
embassy-usb = { git = "https://github.com/romixlab/embassy", rev = "84ae135f91069d49c8dcb823a677e9f4b4a1e534" }
embassy-usb-driver = { git = "https://github.com/romixlab/embassy", rev = "84ae135f91069d49c8dcb823a677e9f4b4a1e534" }
embassy-hal-internal = { git = "https://github.com/romixlab/embassy", rev = "84ae135f91069d49c8dcb823a677e9f4b4a1e534" }
embassy-embedded-hal = { git = "https://github.com/romixlab/embassy", rev = "84ae135f91069d49c8dcb823a677e9f4b4a1e534" }
embassy-sync = { git = "https://github.com/romixlab/embassy", rev = "84ae135f91069d49c8dcb823a677e9f4b4a1e534" }
embassy-time = { git = "https://github.com/romixlab/embassy", rev = "84ae135f91069d49c8dcb823a677e9f4b4a1e534" }
embassy-time-driver = { git = "https://github.com/romixlab/embassy", rev = "84ae135f91069d49c8dcb823a677e9f4b4a1e534" }
embassy-time-queue-utils = { git = "https://github.com/romixlab/embassy", rev = "84ae135f91069d49c8dcb823a677e9f4b4a1e534" }
embassy-executor = { git = "https://github.com/romixlab/embassy", rev = "84ae135f91069d49c8dcb823a677e9f4b4a1e534" }
embassy-executor-macros = { git = "https://github.com/romixlab/embassy", rev = "84ae135f91069d49c8dcb823a677e9f4b4a1e534" }
embassy-executor-timer-queue = { git = "https://github.com/romixlab/embassy", rev = "84ae135f91069d49c8dcb823a677e9f4b4a1e534" }
embassy-futures = { git = "https://github.com/romixlab/embassy", rev = "84ae135f91069d49c8dcb823a677e9f4b4a1e534" }
embassy-net-driver-channel = { git = "https://github.com/romixlab/embassy", rev = "84ae135f91069d49c8dcb823a677e9f4b4a1e534" }
embassy-usb-synopsys-otg = { git = "https://github.com/romixlab/embassy", rev = "84ae135f91069d49c8dcb823a677e9f4b4a1e534" }
