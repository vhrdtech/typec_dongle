[package]
name = "donguru"
version = "0.1.1"
edition = "2024"

# standalone crate: keeps an enclosing Cargo workspace from claiming it
[workspace]

[dependencies]
defmt = "1.1"
defmt-rtt = { version = "1.3", features = ["disable-blocking-mode"] }
panic-probe = { version = "1.0", features = ["print-defmt"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
portable-atomic = { version = "1.11", features = ["critical-section"] } # atomics for Cortex-M0(+)
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32g0b1ce", "unstable-pac", "exti", "time", "time-driver-tim4"] } # not "any": it would pick TIM15, which drives the PF1 LED
embassy-usb = { version = "0.6.0", default-features = false, features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2" }
static_cell = "2.1"
assign-resources = "0.5.0"
cnt = "0.4"
# CMSIS-DAP command processing (SWD/JTAG state machine), transport written ourselves against embassy-usb: its own
# `usb` module targets the separate `usb-device` crate, incompatible with the embassy-usb stack used here.
# Its own "defmt" feature pulls defmt 0.3, a different major version than ours (1.1): left off, nothing here needs
# to Format-print its types directly.
# "usb-hs": DAP_Info reports a 512-byte DAP packet. Nothing else: the feature only switches `DAP2_PACKET_SIZE`,
# and besides DAP_Info that constant sizes buffers in the `usb` module not used here. The packets are still
# 64 bytes on the bus, src/cmsis_dap.rs splits and joins (FW-19).
dap-rs = { version = "0.2", default-features = false, features = ["usb-hs"] }
# where a CMSIS-DAP request ends when it spans several USB packets: no_std, unit-tested on the host
donguru_dap = { path = "../../donguru_dap" }
# WireWeaver: API crate in the repo root, served by src/ww.rs. wire_weaver from the local checkout next to this repo
donguru_api = { path = "../../donguru_api", features = ["defmt"] }
wire_weaver = { path = "../../../wire_weaver/wire_weaver", default-features = false, features = ["defmt"] }
ww_client_server = { path = "../../../wire_weaver/ww_stdlib/ww_client_server", default-features = false }
wire_weaver_usb_embassy = { path = "../../../wire_weaver/mcu/wire_weaver_usb_embassy" }
usb251xb = { version = "0.1.0", default-features = false, features = ["async", "defmt"] }

[features]
default = ["debug-button"]
# periodic ADC readings in the debug log
debug-adc = []
# switch / button state changes in the debug log
debug-button = []
# stopgap until FW-8: AOZ1375 on from boot, receptacle VBUS passed to the plug (never on the P2625 power-cut bench)
plug-vbus-on = []
# SWD-host starts in SPI mode (FW-21, SPI2 through the SBU level shifter) instead of bit-bang; the mode can still be
# changed at run time with `DonguruApi::swd_mode`
swd-spi = []

[build-dependencies]
# (none)

# to solve "can't find crate for test
[[bin]]
name = "donguru"
path = "src/main.rs"
test = false
doctest = false
bench = false

# See https://docs.rust-embedded.org/book/unsorted/speed-vs-size.html
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3           # embedded dev builds are usually unusable at opt-level 0
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2               # debug info does not end up in flash
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "z"         # 3 = speed, s = size, z = smaller
overflow-checks = false

# Do not optimize build scripts / proc-macros: faster clean builds
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false
