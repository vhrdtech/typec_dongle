[package]
name = "donguru"
version = "0.1.1"
edition = "2024"

# standalone crate: keeps an enclosing Cargo workspace from claiming it
[workspace]

[dependencies]
defmt = "1.1"
defmt-rtt = { version = "1.3", features = ["disable-blocking-mode"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
portable-atomic = { version = "1.11", features = ["critical-section"] } # atomics for Cortex-M0(+)
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32g0b1ce", "unstable-pac", "exti", "time", "time-driver-tim4"] } # not "any": it would pick TIM15, which drives the PF1 LED
embassy-usb = { version = "0.6.0", default-features = false, features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2" }
static_cell = "2.1"
assign-resources = "0.5.0"
cnt = "0.5" # 0.5: used words and format version, served as device.counters (ww_counters)
# crash capture: HardFault / panic record kept across reset, reset cause (src/last_reset.rs); the panic handler
bedrock_crash = { git = "https://github.com/romixlab/embedded_bedrock", features = ["cortex-m", "defmt"] }
# CMSIS-DAP command processing (SWD/JTAG state machine), transport written ourselves against embassy-usb: its own
# `usb` module targets the separate `usb-device` crate, incompatible with the embassy-usb stack used here.
# Its own "defmt" feature pulls defmt 0.3, a different major version than ours (1.1): left off, nothing here needs
# to Format-print its types directly.
# "usb-hs": DAP_Info reports a 512-byte DAP packet. Nothing else: the feature only switches `DAP2_PACKET_SIZE`,
# and besides DAP_Info that constant sizes buffers in the `usb` module not used here. The packets are still
# 64 bytes on the bus, src/cmsis_dap.rs splits and joins (FW-19).
dap-rs = { version = "0.2", default-features = false, features = ["usb-hs"] }
# where a CMSIS-DAP request ends when it spans several USB packets: no_std, unit-tested on the host
donguru_dap = { path = "../../donguru_dap" }
# hub (U301) variant detection and per-variant config: no_std, unit-tested on the host
donguru_hub = { path = "../../donguru_hub" }
# VBUS modes and the guard: no_std, unit-tested on the host
donguru_power = { path = "../../donguru_power" }
# WireWeaver: API crate in the repo root, served by src/ww.rs. wire_weaver from the local checkout next to this repo
donguru_api = { path = "../../donguru_api", features = ["defmt"] }
wire_weaver = { path = "../../../wire_weaver/wire_weaver", default-features = false, features = ["defmt"] }
ww_client_server = { path = "../../../wire_weaver/ww_stdlib/ww_client_server", default-features = false }
# observe tables and stream states of the generated server (SRV-18, counted and reliable streams)
ww_stream = { path = "../../../wire_weaver/ww_stream", default-features = false }
# stdlib traits the API implements (`donguru_api` depends on them too): types in the handler signatures
ww_si = { path = "../../../wire_weaver/ww_stdlib/ww_si", default-features = false, features = ["time", "electrical", "mechanical", "thermal", "i32", "u32"] }
ww_adc = { path = "../../../wire_weaver/ww_stdlib/ww_adc", default-features = false }
ww_board_info = { path = "../../../wire_weaver/ww_stdlib/ww_board_info", default-features = false }
ww_counters = { path = "../../../wire_weaver/ww_stdlib/ww_counters", default-features = false }
ww_firmware_info = { path = "../../../wire_weaver/ww_stdlib/ww_firmware_info", default-features = false, features = ["build-id", "cortex-m", "defmt"] }
ww_gpio = { path = "../../../wire_weaver/ww_stdlib/ww_gpio", default-features = false }
ww_i2c = { path = "../../../wire_weaver/ww_stdlib/ww_i2c", default-features = false }
ww_indication = { path = "../../../wire_weaver/ww_stdlib/ww_indication", default-features = false }
ww_log = { path = "../../../wire_weaver/ww_stdlib/ww_log", default-features = false }
ww_uart = { path = "../../../wire_weaver/ww_stdlib/ww_uart", default-features = false }
ww_uid = { path = "../../../wire_weaver/ww_stdlib/ww_uid", default-features = false }
ww_user_info = { path = "../../../wire_weaver/ww_stdlib/ww_user_info", default-features = false }
wire_weaver_usb_embassy = { path = "../../../wire_weaver/mcu/wire_weaver_usb_embassy" }
usb251xb = { version = "0.1.0", default-features = false, features = ["async", "defmt"] }

[features]
default = ["debug-button", "debug-api"]
# the `debug` level of the API (bring-up and production test, API-18); without it the level answers Unimplemented,
# the API stays the same (decision D2). Can be cut if flash gets scarce.
debug-api = []
# periodic ADC readings in the debug log
debug-adc = []
# switch / button state changes in the debug log
debug-button = []
# SWD-host starts in SPI mode (FW-21, SPI2 through the SBU level shifter) instead of bit-bang; the mode can still be
# changed at run time with `DonguruApi::swd_mode`
swd-spi = []

[build-dependencies]
ww_firmware_info = { path = "../../../wire_weaver/ww_stdlib/ww_firmware_info", features = ["build"] } # FirmwareInfo facts (build.rs)

[dev-dependencies]
# the examples' panic handler; the firmware has its own (src/last_reset.rs, crash capture)
panic-probe = { version = "1.0", features = ["print-defmt"] }

# to solve "can't find crate for test
[[bin]]
name = "donguru"
path = "src/main.rs"
test = false
doctest = false
bench = false

# See https://docs.rust-embedded.org/book/unsorted/speed-vs-size.html
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3           # embedded dev builds are usually unusable at opt-level 0
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2               # debug info does not end up in flash
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3           # speed: USB throughput depends on it (FW-24), 113 KB vs 87 KB for "z"
overflow-checks = false

# Do not optimize build scripts / proc-macros: faster clean builds
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

# Double-buffered USB bulk endpoints on the G0 (FW-24): embassy-rs/embassy#7275 is not released yet. The fork's
# donguru-0.6-double-buffer branch is tag embassy-stm32-v0.6.0 with that driver backported (and embassy-usb's
# endpoint_bulk_*_double_buffered). All embassy crates come from the same tree, as embassy-stm32's path dependencies
# would otherwise clash with the crates.io ones. Back to crates.io once #7275 is released.
[patch.crates-io]
embassy-stm32 = { git = "https://github.com/romixlab/embassy", rev = "17b1c246f43fd11485c9d7be5a0a1a739ff591ed" }
embassy-usb = { git = "https://github.com/romixlab/embassy", rev = "17b1c246f43fd11485c9d7be5a0a1a739ff591ed" }
embassy-usb-driver = { git = "https://github.com/romixlab/embassy", rev = "17b1c246f43fd11485c9d7be5a0a1a739ff591ed" }
embassy-hal-internal = { git = "https://github.com/romixlab/embassy", rev = "17b1c246f43fd11485c9d7be5a0a1a739ff591ed" }
embassy-embedded-hal = { git = "https://github.com/romixlab/embassy", rev = "17b1c246f43fd11485c9d7be5a0a1a739ff591ed" }
embassy-sync = { git = "https://github.com/romixlab/embassy", rev = "17b1c246f43fd11485c9d7be5a0a1a739ff591ed" }
embassy-time = { git = "https://github.com/romixlab/embassy", rev = "17b1c246f43fd11485c9d7be5a0a1a739ff591ed" }
embassy-time-driver = { git = "https://github.com/romixlab/embassy", rev = "17b1c246f43fd11485c9d7be5a0a1a739ff591ed" }
embassy-time-queue-utils = { git = "https://github.com/romixlab/embassy", rev = "17b1c246f43fd11485c9d7be5a0a1a739ff591ed" }
embassy-executor = { git = "https://github.com/romixlab/embassy", rev = "17b1c246f43fd11485c9d7be5a0a1a739ff591ed" }
embassy-executor-macros = { git = "https://github.com/romixlab/embassy", rev = "17b1c246f43fd11485c9d7be5a0a1a739ff591ed" }
embassy-executor-timer-queue = { git = "https://github.com/romixlab/embassy", rev = "17b1c246f43fd11485c9d7be5a0a1a739ff591ed" }
embassy-futures = { git = "https://github.com/romixlab/embassy", rev = "17b1c246f43fd11485c9d7be5a0a1a739ff591ed" }
embassy-net-driver = { git = "https://github.com/romixlab/embassy", rev = "17b1c246f43fd11485c9d7be5a0a1a739ff591ed" }
embassy-net-driver-channel = { git = "https://github.com/romixlab/embassy", rev = "17b1c246f43fd11485c9d7be5a0a1a739ff591ed" }
embassy-usb-synopsys-otg = { git = "https://github.com/romixlab/embassy", rev = "17b1c246f43fd11485c9d7be5a0a1a739ff591ed" }
