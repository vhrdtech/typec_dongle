[package]
name = "donguru"
version = "0.1.0"
edition = "2024"

# standalone crate: keeps an enclosing Cargo workspace from claiming it
[workspace]

[dependencies]
defmt = "1.1"
defmt-rtt = { version = "1.3", features = ["disable-blocking-mode"] }
panic-probe = { version = "1.0", features = ["print-defmt"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
portable-atomic = { version = "1.11", features = ["critical-section"] } # atomics for Cortex-M0(+)
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32g0b1ce", "unstable-pac", "exti", "time", "time-driver-tim4"] } # not "any": it would pick TIM15, which drives the PF1 LED
embassy-usb = { version = "0.6.0", default-features = false, features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2" }
static_cell = "2.1"
assign-resources = "0.5.0"
cnt = "0.4"
# WireWeaver: API crate in the repo root, served by src/ww.rs. wire_weaver from the local checkout next to this repo
donguru_api = { path = "../../donguru_api", features = ["defmt"] }
wire_weaver = { path = "../../../wire_weaver/wire_weaver", default-features = false, features = ["defmt"] }
ww_client_server = { path = "../../../wire_weaver/ww_stdlib/ww_client_server", default-features = false }
wire_weaver_usb_embassy = { path = "../../../wire_weaver/mcu/wire_weaver_usb_embassy" }

[features]
default = ["debug-button"]
# periodic ADC readings in the debug log
debug-adc = []
# switch / button state changes in the debug log
debug-button = []

[build-dependencies]
# (none)

# to solve "can't find crate for test
[[bin]]
name = "donguru"
path = "src/main.rs"
test = false
doctest = false
bench = false

# See https://docs.rust-embedded.org/book/unsorted/speed-vs-size.html
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3           # embedded dev builds are usually unusable at opt-level 0
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2               # debug info does not end up in flash
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "z"         # 3 = speed, s = size, z = smaller
overflow-checks = false

# Do not optimize build scripts / proc-macros: faster clean builds
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false
