[target.thumbv6m-none-eabi]
#runner = "probe-rs run --chip STM32G0B1CE"
runner = "cnt run --chip STM32G0B1CE"
# Stack overflow protection: the stack goes below .data/.bss and overflows fault (cargo install flip-link)
linker = "flip-link"

[build]
target = "thumbv6m-none-eabi"

[env]
DEFMT_LOG = "debug,donguru=debug"
# DEFMT_RTT_BUFFER_SIZE = "4096" # larger buffer avoids losing output in bursts (init)
CNT_RAM_BUFFER_SIZE_WORDS = "64"
CNT_BKP_BUFFER_SIZE_WORDS = "4" # must fit into BKPSRAM in memory.x (the fifth register is the boot word, FW-12)

# Release firmware without panic locations (file, line and column of every panic site, FW-63): a panic record keeps
# the return addresses instead (bedrock_crash), and `donguru device reset-cause` names the site from the ELF
[profile.release]
rustflags = ["-Zlocation-detail=none"]

[unstable]
profile-rustflags = true
