[package]
name = "donguru-cli"
version.workspace = true
edition.workspace = true
description = "Command-line interface for the Donguru USB-C dongle"

[lib]
name = "donguru_cli"
path = "src/lib.rs"

# The same executable is installed under two names: `donguru` and `dg`.
[[bin]]
name = "donguru"
path = "src/main.rs"

[dependencies]
donguru-core = { workspace = true, features = ["probe-rs"] }
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
humantime.workspace = true
indicatif = "0.18.6"
# `device select` persists the device key in ./donguru.toml (CLI-7)
toml = "0.9"
# rendering `device reset-cause` (CLI-19): the types `Device::last_reset` returns
ww_firmware_info = { path = "../../wire_weaver/ww_stdlib/ww_firmware_info", features = ["std"] }
# runs the WireWeaver client's event loop; "signal" for Ctrl-C in `power watch`
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }

[dev-dependencies]
donguru-core = { workspace = true, features = ["probe-rs", "mock"] }
# Colour-aware stdout for the theme_preview example.
anstream = "1"
insta = { version = "1", features = ["json"] }
tempfile = "3"
wire_weaver = { path = "../../wire_weaver/wire_weaver", features = ["std"] }
