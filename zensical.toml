[project]
site_url = "https://www.example.com/"
site_name = "Donguru"
site_description = "USB-Type-C dongle with a USB Hub, USART/I2C/GPIO/ADC, power switch and power meter."
# site_author = "Your name"

copyright = "Copyright &copy; 2026 vhrdtech"

repo_url = "https://github.com/vhrdtech/typec_dongle"
repo_name = "vhrdtech/typec_dongle"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "About" = "about/index.md" },
  { "Documentation" = [
      "user/index.md",
      { "Quickstart" = "user/quickstart.md" },
      { "Usage" = "user/usage.md" },
  ]
  },
  { "Development" = "development/index.md" },
  { "Design" = [
      "design/index.md",
      { "CLI" = [
          "design/cli/index.md",
          { "Implementation" = "design/cli/implementation.md" },
          { "Evaluations" = [
              "design/cli/evaluations/index.md",
              { "figment vs config" = "design/cli/evaluations/config-figment-vs-config.md" },
              { "tabled vs comfy-table" = "design/cli/evaluations/tables-tabled-vs-comfy-table.md" },
          ]
          },
      ]
      },
  ]
  },
  { "References" = [
      "reference/index.md",
      { "Zensical" = "reference/zensical.md" },
      { "Markdown" = "reference/markdown.md" },
  ]
  },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "teal"
accent = "teal"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "teal"
accent = "teal"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/vhrdtech/typec_dongle"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = {
  permalink = true
}
pymdownx.arithmatex = {
  generic = true
}
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
}
pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets = {
#   base_path = "includes",
# }
pymdownx.superfences = {
  custom_fences = [
    {
      name = "mermaid",
      class = "mermaid",
      format = "pymdownx.superfences.fence_code_format",
    },
  ],
}
pymdownx.tabbed = {
  alternate_style = true,
  combine_header_slug = true
}
pymdownx.tasklist = {
  custom_checkbox = true
}
pymdownx.tilde = {}
