[package]
name = "portwright_board"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Board logic of the portwright firmware (B153): early boot, USB hub configuration, VBUS switch guard; no_std, unit-tested on the host"

[dependencies]
defmt = { version = "1.1", optional = true }
portwright_api = { path = "../portwright_api" }
usb251xb = { version = "0.1.0", default-features = false }
# MaxLen / RefVec of the PD log records (`pd`)
shrink_wrap = { git = "https://github.com/romixlab/shrink_wrap", default-features = false }
ww_si = { git = "https://github.com/vhrdtech/ww_base", default-features = false, features = ["time", "electrical", "u16", "u32", "i32"] }

[features]
defmt = ["dep:defmt"]
