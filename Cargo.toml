[workspace]
resolver = "3"
members = ["donguru-cli", "donguru-core", "donguru-py", "donguru_api", "donguru_board", "donguru_dap", "xtask"]

[workspace.package]
version = "0.20.31"
edition = "2024"
license = "TBD"
repository = ""

[workspace.dependencies]
donguru-core = { path = "donguru-core" }
donguru_api = { path = "donguru_api", features = ["std"] }

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# just install: release, but incremental so a rebuild after a small change is quick
[profile.deploy]
inherits = "release"
incremental = true
