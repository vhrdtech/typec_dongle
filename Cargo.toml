[workspace]
resolver = "3"
members = ["portwright-cli", "portwright-core", "portwright-py", "portwright_api", "portwright_board", "portwright_dap", "xtask"]

[workspace.package]
version = "0.20.52"
edition = "2024"
license = "TBD"

[workspace.dependencies]
portwright-core = { path = "portwright-core" }
portwright_api = { path = "portwright_api", features = ["std"] }

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# just install: release, but incremental so a rebuild after a small change is quick
[profile.deploy]
inherits = "release"
incremental = true

# WireWeaver comes by git from four repositories (members' manifests), pinned by Cargo.lock: the framework from
# wire_weaver, the base types (ww_si, ww_date_time, ...) from ww_base, the standard APIs (ww_adc, ww_uart, ...) from
# ww_stdlib, shrink_wrap from its own repository; exact_units (ww_si's units) takes shrink_wrap from that same URL, so
# there is one shrink_wrap without a patch. pd_bench comes by git too. Local development against sibling checkouts:
# put such blocks in an uncommitted .cargo/config.toml of the worktree (cargo update -p wire_weaver afterwards).
# stm32_dfu_host is the package behind the `ww_stm32_dfu` alias in portwright-core.
# [patch."https://github.com/vhrdtech/wire_weaver"]
# wire_weaver = { path = "../wire_weaver/wire_weaver" }
# wire_weaver_client = { path = "../wire_weaver/wire_weaver_client" }
# wire_weaver_evolution = { path = "../wire_weaver/wire_weaver_evolution" }
# stm32_dfu_host = { path = "../wire_weaver/stm32_dfu_host" }
# ww_api = { path = "../wire_weaver/ww_api" }
# ww_client_server = { path = "../wire_weaver/ww_client_server" }
# ww_device = { path = "../wire_weaver/ww_device" }
# ww_stream = { path = "../wire_weaver/ww_stream" }
# ww_timebase = { path = "../wire_weaver/ww_timebase" }
# [patch."https://github.com/vhrdtech/ww_base"]
# ww_date_time = { path = "../ww_base/ww_date_time" }
# ww_si = { path = "../ww_base/ww_si" }
# [patch."https://github.com/vhrdtech/ww_stdlib"]
# ww_adc = { path = "../ww_stdlib/ww_adc" }
# ww_board_info = { path = "../ww_stdlib/ww_board_info" }
# ww_counters = { path = "../ww_stdlib/ww_counters" }
# ww_dfu = { path = "../ww_stdlib/ww_dfu" }
# ww_firmware_info = { path = "../ww_stdlib/ww_firmware_info" }
# ww_gpio = { path = "../ww_stdlib/ww_gpio" }
# ww_i2c = { path = "../ww_stdlib/ww_i2c" }
# ww_indication = { path = "../ww_stdlib/ww_indication" }
