[workspace]
resolver = "3"
members = ["donguru-cli", "donguru-core", "donguru_api", "donguru_dap", "donguru_hub", "donguru_power"]

[workspace.package]
version = "0.20.10"
edition = "2024"
license = "TBD"
repository = ""

[workspace.dependencies]
donguru-core = { path = "donguru-core" }
donguru_api = { path = "donguru_api", features = ["std"] }

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
