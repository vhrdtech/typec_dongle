[package]
name = "portwright-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for the Portwright USB-C dongle"

[lib]
name = "portwright_cli"
path = "src/lib.rs"

# The same executable is installed under two names: `portwright` and `pw`.
[[bin]]
name = "portwright"
path = "src/main.rs"

[dependencies]
portwright-core = { workspace = true, features = ["probe-rs"] }
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
humantime.workspace = true
indicatif = "0.18.6"
# `device select` persists the device key in ./portwright.toml (CLI-7)
toml = "0.9"
# rendering `device reset-cause` (CLI-19): the types `Device::last_reset` returns
ww_firmware_info = { git = "https://github.com/vhrdtech/ww_stdlib", features = ["std"] }
# `pw settings set uart_plug` / `meter_deadband`: the baud rate, framing and quantity constructors (CLI-47)
ww_si = { git = "https://github.com/vhrdtech/ww_base", features = ["std", "time", "electrical"] }
ww_uart = { git = "https://github.com/vhrdtech/ww_stdlib", features = ["std"] }
# runs the WireWeaver client's event loop; "signal" for Ctrl-C in `power watch`
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
# `pw pd log`'s JSON lines and screen decode (pd_bench LOG-1), the same types `portwright-core::pd` builds
pd_log = { git = "ssh://git@github.com/romixlab/pd_bench", features = ["std"] }

[dev-dependencies]
portwright-core = { workspace = true, features = ["probe-rs", "mock"] }
# Colour-aware stdout for the theme_preview example.
anstream = "1"
insta = { version = "1", features = ["json"] }
tempfile = "3"
wire_weaver = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"] }

# PKG-3: `cargo deb --no-build -p portwright-cli` from the workspace root, after `just package` has
# built the release binary and generated man pages / completions into target/dist.
[package.metadata.deb]
maintainer = "vhrd.tech <hello@vhrd.tech>"
depends = "$auto"
section = "utility"
priority = "optional"
maintainer-scripts = "../packaging/deb"
#
# `target/release/...` gets cargo-deb's special handling (resolved against the real cargo target
# dir regardless of package dir); every other asset path is relative to this crate's own
# directory, so the dist/ and packaging/ assets built from the workspace root need a `../`.
assets = [
    ["target/release/portwright", "usr/bin/", "755"],
    ["../target/dist/man/*.1", "usr/share/man/man1/", "644"],
    ["../packaging/pw.1", "usr/share/man/man1/", "644"],
    ["../target/dist/completions/bash/portwright", "usr/share/bash-completion/completions/portwright", "644"],
    ["../target/dist/completions/bash/pw", "usr/share/bash-completion/completions/pw", "644"],
    ["../target/dist/completions/zsh/_portwright", "usr/share/zsh/site-functions/_portwright", "644"],
    ["../target/dist/completions/zsh/_dg", "usr/share/zsh/site-functions/_dg", "644"],
    ["../target/dist/completions/fish/portwright.fish", "usr/share/fish/vendor_completions.d/portwright.fish", "644"],
    ["../target/dist/completions/fish/pw.fish", "usr/share/fish/vendor_completions.d/pw.fish", "644"],
    ["../packaging/60-portwright.rules", "usr/lib/udev/rules.d/60-portwright.rules", "644"],
]

# PKG-3: `cargo generate-rpm -p portwright-cli` from the workspace root, same inputs as cargo-deb above.
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/portwright", dest = "/usr/bin/portwright", mode = "755" },
    { source = "target/dist/man/*.1", dest = "/usr/share/man/man1/", mode = "644", doc = true },
    { source = "../packaging/pw.1", dest = "/usr/share/man/man1/pw.1", mode = "644", doc = true },
    { source = "target/dist/completions/bash/portwright", dest = "/usr/share/bash-completion/completions/portwright", mode = "644" },
    { source = "target/dist/completions/bash/pw", dest = "/usr/share/bash-completion/completions/pw", mode = "644" },
    { source = "target/dist/completions/zsh/_portwright", dest = "/usr/share/zsh/site-functions/_portwright", mode = "644" },
    { source = "target/dist/completions/zsh/_dg", dest = "/usr/share/zsh/site-functions/_dg", mode = "644" },
    { source = "target/dist/completions/fish/portwright.fish", dest = "/usr/share/fish/vendor_completions.d/portwright.fish", mode = "644" },
    { source = "target/dist/completions/fish/pw.fish", dest = "/usr/share/fish/vendor_completions.d/pw.fish", mode = "644" },
    { source = "../packaging/60-portwright.rules", dest = "/usr/lib/udev/rules.d/60-portwright.rules", mode = "644" },
]
post_install_script = """
ln -sf portwright /usr/bin/pw
udevadm control --reload-rules || true
udevadm trigger || true
"""
post_uninstall_script = """
if [ "$1" = "0" ]; then
    rm -f /usr/bin/pw
    udevadm control --reload-rules || true
    udevadm trigger || true
fi
"""
