[package]
name = "donguru_board"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Board logic of the donguru firmware (B153): early boot, USB hub configuration, VBUS switch guard; no_std, unit-tested on the host"

[dependencies]
defmt = { version = "1.1", optional = true }
donguru_api = { path = "../donguru_api" }
usb251xb = { version = "0.1.0", default-features = false }
ww_si = { path = "../../wire_weaver/ww_stdlib/ww_si", default-features = false, features = ["time", "electrical", "u16", "u32", "i32"] }

[features]
defmt = ["dep:defmt"]
